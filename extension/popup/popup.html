<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Resolvy</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <img src="../icons/icon32.png" alt="" width="20" height="20" />
    <strong>Resolvy</strong>
  </header>

  <!-- Login -->
  <form id="login-view" hidden>
    <label>Login
      <input id="login" placeholder="seu login" autocomplete="username" autocapitalize="none" spellcheck="false" required />
    </label>
    <label>Key
      <input id="key" type="password" placeholder="sua key" autocomplete="current-password" spellcheck="false" required />
    </label>
    <details>
      <summary>Servidor</summary>
      <label>Endereço
        <input id="server" type="url" placeholder="https://seu-servidor.com" />
      </label>
    </details>
    <button type="submit" id="login-btn">Entrar</button>
    <p class="msg" id="login-msg" role="alert"></p>
  </form>

  <!-- Autenticado -->
  <main id="main-view" hidden>
    <p class="who">Conectado <span id="who-label"></span></p>

    <div class="stack">
      <button data-mode="resumo">Resumir página</button>
      <button data-mode="acessibilidade" class="secondary">Guia de acessibilidade</button>
    </div>

    <form id="ask-form" class="ask">
      <label for="question">Perguntar sobre a página</label>
      <textarea id="question" rows="2" maxlength="500" placeholder="Ex.: Qual é o prazo de inscrição?"></textarea>
      <button type="submit" class="secondary">Perguntar</button>
    </form>

    <section class="shortcuts">
      <h2>Atalhos de teclado</h2>
      <ul id="shortcut-list"></ul>
      <button id="edit-shortcuts" class="secondary small">Alterar atalhos</button>
    </section>

    <p class="hint">Dica: selecione um trecho antes para analisar só ele.</p>
    <p class="msg" id="main-msg" role="alert"></p>
    <button id="logout" class="link">Sair</button>
  </main>

  <script src="../config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
